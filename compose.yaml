services:
  app:
    build:
      context: .
    ports:
      - "8000:8000"
    environment:
      VENDING_SERVICE_PASSWORD_HASH: ${VENDING_SERVICE_PASSWORD_HASH:-}
      VENDING_CURRENCY_CODE: ${VENDING_CURRENCY_CODE:-BGN}
      VENDING_CURRENCY_SYMBOL: ${VENDING_CURRENCY_SYMBOL:-лв.}
      VENDING_CURRENCY_DECIMALS: ${VENDING_CURRENCY_DECIMALS:-2}
